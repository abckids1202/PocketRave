[platformio]
default_envs = nanoatmega328
src_dir = .

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
build_flags =
  -Wall
  -Wextra
build_src_filter =
  +<PocketRave.ino>
  +<*.cpp>
  -<examples/>
